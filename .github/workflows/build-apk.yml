name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build and Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v java >/dev/null 2>&1; then
            echo "::error::Java executable not found in PATH."
            exit 1
          fi
          java -version
          echo "JAVA_HOME=${JAVA_HOME:-<not set>}"
          VERSION_RAW="$(java -version 2>&1 | head -n 1 | sed -nE 's/.*"([^"]+)".*/\1/p')"
          if [ -z "$VERSION_RAW" ]; then
            echo "::error::Unable to detect active Java version."
            exit 1
          fi
          if [[ "$VERSION_RAW" == 1.* ]]; then
            MAJOR_VERSION="$(echo "$VERSION_RAW" | cut -d'.' -f2)"
          else
            MAJOR_VERSION="$(echo "$VERSION_RAW" | cut -d'.' -f1 | sed -E 's/[^0-9].*//')"
          fi
          if ! [[ "$MAJOR_VERSION" =~ ^[0-9]+$ ]]; then
            echo "::error::Unable to parse Java major version from '$VERSION_RAW'."
            exit 1
          fi
          echo "Detected Java major version: ${MAJOR_VERSION}"
          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, but detected Java ${MAJOR_VERSION}."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        env:
          DEBUG_KEYSTORE_BASE64_SECRET: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="./debug.keystore"
          KEYSTORE_SOURCE="existing"
          KEYTOOL_BIN="keytool"
          if [ -n "${JAVA_HOME:-}" ] && [ -x "${JAVA_HOME}/bin/keytool" ]; then
            KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
          fi
          if [ ! -f "$KEYSTORE_PATH" ]; then
            if [ -n "${DEBUG_KEYSTORE_BASE64_SECRET:-}" ]; then
              printf '%s' "$DEBUG_KEYSTORE_BASE64_SECRET" | tr -d '\r\n ' | base64 -d > "$KEYSTORE_PATH"
              KEYSTORE_SOURCE="github-secret"
              echo "Decoded debug keystore from GitHub Secret DEBUG_KEYSTORE_BASE64."
            elif [ -f "./debug.keystore.base64" ] && [ -s "./debug.keystore.base64" ]; then
              tr -d '\r\n ' < "./debug.keystore.base64" | base64 -d > "$KEYSTORE_PATH"
              KEYSTORE_SOURCE="repo-file"
              echo "Decoded project debug keystore from debug.keystore.base64."
            else
              "$KEYTOOL_BIN" -genkeypair \
                -keystore "$KEYSTORE_PATH" \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -dname "CN=Android Debug,O=Android,C=US" \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -noprompt >/dev/null
              KEYSTORE_SOURCE="generated-fallback"
              echo "::warning::debug.keystore.base64 and secret DEBUG_KEYSTORE_BASE64 were not found! Generated a temporary keystore with a NEW random SHA-1. Google Sign-In will fail unless this SHA-1 is registered in Firebase or DEBUG_KEYSTORE_BASE64 is added."
            fi
          fi
          if [ ! -f "$KEYSTORE_PATH" ] || [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::Failed to prepare debug keystore at ${KEYSTORE_PATH}."
            exit 1
          fi
          SHA1_FP="$("$KEYTOOL_BIN" -list -v -keystore "$KEYSTORE_PATH" -storepass android -alias androiddebugkey 2>/dev/null | sed -nE 's/^[[:space:]]*SHA1:[[:space:]]*//p' | head -n 1 || true)"
          echo "Debug keystore source: ${KEYSTORE_SOURCE}"
          echo "Debug keystore SHA-1: ${SHA1_FP:-unknown}"
          {
            echo "### Signing Keystore"
            echo "- **Source:** \`${KEYSTORE_SOURCE}\`"
            echo "- **SHA-1:** \`${SHA1_FP:-unknown}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure Firebase google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          TARGET_PATH="app/google-services.json"
          if [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            python3 - <<'PYEOF'
          import base64, json, os, sys
          raw = os.environ.get("GOOGLE_SERVICES_JSON", "").strip()
          if raw.startswith("{"):
              text = raw
          else:
              cleaned = "".join(raw.split())
              text = base64.b64decode(cleaned).decode("utf-8")
          json.loads(text)
          with open("app/google-services.json", "w", encoding="utf-8") as f:
              f.write(text)
          PYEOF
            echo "Firebase app/google-services.json configured from GitHub Secret (Cloud Sync enabled)."
          elif [ -f "$TARGET_PATH" ] && [ -s "$TARGET_PATH" ]; then
            echo "Using existing app/google-services.json from repository."
          else
            echo "::notice::GitHub Secret GOOGLE_SERVICES_JSON is not set; APK will build in local offline-ready mode."
          fi

      - name: Build debug APK
        id: build_apk
        shell: bash
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        id: verify_apk
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -e "$APK_PATH" ]; then
            echo "::error::Expected debug APK not found at ${APK_PATH}."
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APK files under app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name '*.apk' -print || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::${APK_PATH} is not a regular file."
            exit 1
          fi
          if [ ! -s "$APK_PATH" ]; then
            echo "::error::${APK_PATH} is empty."
            exit 1
          fi
          if [[ "$APK_PATH" != *.apk ]]; then
            echo "::error::${APK_PATH} does not have the .apk extension."
            exit 1
          fi
          echo "Verified debug APK: ${APK_PATH}"

      - name: Upload debug APK artifact
        id: upload_apk_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_release_asset
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_DIR="$(mktemp -d "${RUNNER_TEMP}/apk-release.XXXXXX")"
          ASSET_PATH="${RELEASE_DIR}/app-debug.apk"
          cp "$SOURCE_APK" "$ASSET_PATH"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Prepared release APK asset is missing or empty."
            exit 1
          fi
          if [ "$(basename "$ASSET_PATH")" != "app-debug.apk" ]; then
            echo "::error::Release asset filename must be exactly app-debug.apk."
            exit 1
          fi
          echo "asset_path=${ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: $(basename "$ASSET_PATH")"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_release_asset.outputs.asset_path }}
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v gh >/dev/null 2>&1; then
            echo "::error::GitHub CLI (gh) is not available."
            exit 1
          fi
          gh --version

          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Prepared APK asset does not exist or is empty."
            exit 1
          fi
          ASSET_NAME="$(basename "$ASSET_PATH")"
          if [[ "$ASSET_NAME" != *.apk ]] || [ "$ASSET_NAME" != "app-debug.apk" ]; then
            echo "::error::Release asset must end in .apk and be named exactly app-debug.apk (got '${ASSET_NAME}')."
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"

          NOTES_FILE="$(mktemp "${RUNNER_TEMP}/release-notes.XXXXXX.md")"
          cat <<EOF > "$NOTES_FILE"
          This is an automatically generated debug APK built by GitHub Actions.

          - **GitHub Actions Run Number:** ${GITHUB_RUN_NUMBER}
          - **GitHub Actions Run Attempt:** ${GITHUB_RUN_ATTEMPT}
          - **Source Commit SHA:** \`${GITHUB_SHA}\`
          - **Asset Filename:** \`app-debug.apk\`

          **Important Notices:**
          - This APK is intended for testing only.
          - This APK is not a Play Store production release.
          - This APK is signed only with a temporary debug keystore.
          EOF

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file "$NOTES_FILE" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_OUTCOME: ${{ steps.build_apk.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify_apk.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.upload_apk_artifact.outcome }}
          RELEASE_OUTCOME: ${{ steps.publish_release.outcome }}
          RELEASE_TAG: ${{ steps.publish_release.outputs.release_tag }}
          RELEASE_TITLE: ${{ steps.publish_release.outputs.release_title }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RELEASE_OUTCOME" = "success" ]; then
            gh release view "$RELEASE_TAG"
            RELEASE_URL="$(gh release view "$RELEASE_TAG" --json url -q .url)"
            DIRECT_APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"

            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: ${RELEASE_TITLE}"
            echo "Release Page URL: ${RELEASE_URL}"
            echo "APK Filename: app-debug.apk"
            echo "DIRECT APK DOWNLOAD: ${DIRECT_APK_URL}"
            echo "Backup Actions artifact 'app-debug-apk' remains available."

            {
              echo "## DIRECT APK DOWNLOAD"
              echo ""
              echo "${DIRECT_APK_URL}"
              echo ""
              echo "- **Release Tag:** \`${RELEASE_TAG}\`"
              echo "- **Release Title:** ${RELEASE_TITLE}"
              echo "- **Release Page:** ${RELEASE_URL}"
              echo "- **APK Filename:** \`app-debug.apk\`"
              echo ""
              echo "The normal GitHub Actions artifact \`app-debug-apk\` remains available as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing did not succeed (outcome: ${RELEASE_OUTCOME})."
            if [ "$BUILD_OUTCOME" = "success" ] && [ "$VERIFY_OUTCOME" = "success" ]; then
              echo "The debug APK build succeeded."
            fi
            if [ "$ARTIFACT_OUTCOME" = "success" ]; then
              echo "The GitHub Actions artifact named 'app-debug-apk' remains available as a backup."
            fi
            echo "The new APK is NOT confirmed to be available through the direct latest-release link."

            {
              echo "## GitHub Release Warning"
              echo ""
              echo "GitHub Release publishing failed (outcome: \`${RELEASE_OUTCOME}\`)."
              if [ "$BUILD_OUTCOME" = "success" ] && [ "$VERIFY_OUTCOME" = "success" ]; then
                echo "- Debug APK build: **Succeeded**"
              fi
              if [ "$ARTIFACT_OUTCOME" = "success" ]; then
                echo "- GitHub Actions backup artifact \`app-debug-apk\`: **Available**"
              fi
              echo "- Do not assume the newly built APK is available at the direct latest-release link."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
